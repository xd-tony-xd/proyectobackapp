# ===============================
# ? Configuración general
# ===============================
spring.application.name=proyectofinalapp
server.port=8080

# ===============================
# ? Conexión a MySQL (AlwaysData)
# ===============================
spring.datasource.url=jdbc:mysql://mysql-antonyxd.alwaysdata.net:3306/antonyxd_proyectofinalapp?useSSL=false&serverTimezone=UTC
spring.datasource.username=antonyxd
spring.datasource.password=Antonyxyz1


# ===============================
# ? JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ===============================
# ? CORS / JSON / Timezone
# ===============================
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===============================
# ? JWT Config (opcional)
# ===============================
jwt.secret=mi_clave_secreta_segura_123456
jwt.expiration=86400000  # 24 horas en milisegundos
